<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="No contacts yet">
  <defs>
    <linearGradient id="nc-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="110" fill="#dbeafe" opacity="0.6"/>
  <!-- Contact card with avatar + name/role lines -->
  <g fill="#ffffff" stroke="url(#nc-g)" stroke-width="3" stroke-linejoin="round">
    <rect x="120" y="95" width="160" height="110" rx="8"/>
  </g>
  <!-- Avatar circle (left-aligned inside card) -->
  <g fill="url(#nc-g)">
    <circle cx="155" cy="130" r="18"/>
    <!-- Avatar body (shoulders) -->
    <path d="M135 170 Q135 152 155 152 Q175 152 175 170 L175 178 L135 178 Z"/>
  </g>
  <!-- Placeholder text lines (name + role + email) -->
  <g fill="#2563eb" opacity="0.4">
    <rect x="185" y="118" width="75" height="8" rx="3"/>
    <rect x="185" y="135" width="55" height="6" rx="3"/>
    <rect x="185" y="150" width="70" height="6" rx="3"/>
  </g>
  <!-- Subtle secondary card behind (hint of more contacts) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" opacity="0.25">
    <rect x="130" y="85" width="160" height="110" rx="8"/>
  </g>
</svg>
