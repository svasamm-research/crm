<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="No deals yet">
  <defs>
    <linearGradient id="nd-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Background tint -->
  <circle cx="200" cy="150" r="110" fill="#dbeafe" opacity="0.6"/>
  <!-- Stacked deal cards (outline, empty) -->
  <g fill="#ffffff" stroke="url(#nd-g)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="130" y="185" width="140" height="25" rx="4"/>
    <rect x="125" y="155" width="150" height="25" rx="4"/>
    <rect x="120" y="125" width="160" height="25" rx="4"/>
    <rect x="115" y="95" width="170" height="25" rx="4"/>
  </g>
  <!-- Small decorative accents inside each card -->
  <g fill="#2563eb" opacity="0.5">
    <circle cx="128" cy="107" r="3"/>
    <rect x="138" y="104" width="50" height="6" rx="3"/>
    <circle cx="133" cy="137" r="3"/>
    <rect x="143" y="134" width="45" height="6" rx="3"/>
    <circle cx="138" cy="167" r="3"/>
    <rect x="148" y="164" width="42" height="6" rx="3"/>
    <circle cx="143" cy="197" r="3"/>
    <rect x="153" y="194" width="40" height="6" rx="3"/>
  </g>
</svg>
