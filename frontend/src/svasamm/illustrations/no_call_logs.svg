  <g stroke="#2563eb" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M280 130 Q295 140 280 155"/>
    <path d="M290 115 Q315 140 290 170"/>
    <path d="M300 100 Q335 140 300 185"/>
