<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="No tasks yet">
  <defs>
    <linearGradient id="nt-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="110" fill="#dbeafe" opacity="0.6"/>
  <!-- Task clipboard outline -->
  <g stroke="url(#nt-g)" stroke-width="3" stroke-linejoin="round" fill="#ffffff">
    <!-- Clip at top -->
    <rect x="170" y="70" width="60" height="14" rx="4"/>
    <!-- Clipboard body -->
    <rect x="140" y="80" width="120" height="150" rx="6"/>
  </g>
  <!-- Checklist lines inside (empty, with unchecked boxes) -->
  <g stroke="url(#nt-g)" stroke-width="2" fill="none">
    <rect x="155" y="105" width="12" height="12" rx="2"/>
    <rect x="155" y="135" width="12" height="12" rx="2"/>
    <rect x="155" y="165" width="12" height="12" rx="2"/>
    <rect x="155" y="195" width="12" height="12" rx="2"/>
  </g>
  <g fill="#2563eb" opacity="0.5">
    <rect x="175" y="108" width="70" height="6" rx="3"/>
    <rect x="175" y="138" width="65" height="6" rx="3"/>
    <rect x="175" y="168" width="70" height="6" rx="3"/>
    <rect x="175" y="198" width="60" height="6" rx="3"/>
  </g>
</svg>
