# E2E (Playwright) — snapshot suite for the Svasamm CRM SPA branding layer.
#
# Key design choices:
# - Stands up a fresh bench per run: frappe v16.9.0 + erpnext v16.9.1 + this fork.
# - Uses `Administrator` / `admin` for auth. Fresh CI site has no custom users.
# - `bench start` runs in background; polled on /api/method/ping for readiness.
# - First-run baseline capture: if `frontend/e2e/snapshots/` is absent the step
#   runs `playwright test --update-snapshots` and uploads the captured images
#   as an artifact. On subsequent runs strict diff checks run instead.
# - GitHub App token (App ID 3418788, stored as vars.SVASAMM_APP_ID +
#   secrets.SVASAMM_APP_PRIVATE_KEY) is generated for any cross-repo checkout
#   need. Pattern mirrors videojet_override/.github/workflows/server-tests.yml.
#
# ─────────────────────────────────────────────────────────────
# FIRST-RUN BASELINE CAPTURE
# On the first CI run of this branch, frontend/e2e/snapshots/ won't
# exist in the repo. This job runs `playwright test --update-snapshots`
# to capture initial baselines, and uploads them as a 'snapshots'
# artifact. The developer must download that artifact, place it at
# frontend/e2e/snapshots/, and commit + push.
#
# After the first successful baseline commit, subsequent CI runs
# perform strict diff checks. Intentional branding changes require:
#   npx --prefix frontend playwright test --update-snapshots
# locally, then commit the updated snapshots.
# ─────────────────────────────────────────────────────────────

name: E2E (Playwright)

on:
  pull_request:
  push:
    branches: [main, develop, uat]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Playwright snapshot suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:alpine
        ports:
          - 12000:6379

    steps:
      # Generate a short-lived (~1 hour) installation token from the svasamm
      # GitHub App. Kept available for any future cross-repo checkout needs;
      # the fork itself uses the default GITHUB_TOKEN.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SVASAMM_APP_ID }}
          private-key: ${{ secrets.SVASAMM_APP_PRIVATE_KEY }}
          owner: svasamm-research

      - name: Checkout svasamm_crm (this fork)
        uses: actions/checkout@v4
        with:
          path: apps/crm
          # This is the fork being tested — default GITHUB_TOKEN works.

      - name: Checkout frappe
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: v16.9.0
          path: apps/frappe

      - name: Checkout erpnext
        uses: actions/checkout@v4
        with:
          repository: frappe/erpnext
          ref: v16.9.1
          path: apps/erpnext

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init \
            --skip-redis-config-generation \
            --frappe-path $GITHUB_WORKSPACE/apps/frappe \
            --python python3 \
            frappe-bench
          cd frappe-bench
          bench set-config -g developer_mode 1
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:12000

      - name: Install apps into bench
        working-directory: frappe-bench
        run: |
          bench get-app erpnext $GITHUB_WORKSPACE/apps/erpnext
          bench get-app crm $GITHUB_WORKSPACE/apps/crm

      - name: Set MariaDB config
        run: |
          mysql -h 127.0.0.1 --port 3306 -uroot -proot -e "
            SET GLOBAL character_set_server = utf8mb4;
            SET GLOBAL collation_server = utf8mb4_unicode_ci;
            CREATE USER 'frappe'@'%' IDENTIFIED BY 'frappe';
            GRANT ALL PRIVILEGES ON *.* TO 'frappe'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Create test site with CRM
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost \
            --mariadb-root-password root \
            --admin-password admin \
            --db-type mariadb
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app crm
          bench --site test.localhost set-config allow_tests true

      - name: Build CRM SPA
        working-directory: frappe-bench/apps/crm
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build

      - name: Install Playwright + chromium
        working-directory: frappe-bench/apps/crm
        run: |
          npx --prefix frontend playwright install chromium --with-deps

      - name: Start bench (background) + wait for ready
        working-directory: frappe-bench
        run: |
          bench start &>/dev/null &
          echo $! > /tmp/bench.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://test.localhost:8000/api/method/ping; then
              echo "bench ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Fail if bench never came up
          curl -sf -o /dev/null http://test.localhost:8000/api/method/ping

      - name: Run Playwright tests (baseline capture if snapshots missing)
        working-directory: frappe-bench/apps/crm
        env:
          BENCH_URL: http://test.localhost:8000
          TEST_USER: Administrator
          TEST_USER_PWD: admin
        run: |
          # --update-snapshots only creates missing baselines; existing ones
          # are still diff-checked. On first run this captures initial
          # baselines. On subsequent runs it's effectively a no-op for
          # existing baselines, update-check for drift.
          if [ ! -d frontend/e2e/snapshots ]; then
            echo "No baselines yet — capturing first-time snapshots"
            npx --prefix frontend playwright test --update-snapshots
          else
            npx --prefix frontend playwright test
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frappe-bench/apps/crm/frontend/playwright-report/
          retention-days: 7

      - name: Upload captured snapshots (first-run)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: frappe-bench/apps/crm/frontend/e2e/snapshots/
          retention-days: 14

      - name: Stop bench
        if: always()
        run: |
          kill $(cat /tmp/bench.pid) 2>/dev/null || true
