exclude: "node_modules|.git"
default_stages: [pre-commit]
fail_fast: false

# Preserved from upstream frappe/crm v1.66.2 so pre-commit rules match
# what upstream authored (avoids 197-file formatting-drift diffs that would
# make upstream bumps painful). Only two Svasamm additions:
#   1. no-commit-to-branch also blocks main (upstream only blocks develop)
#   2. commitlint hook for Conventional Commits (commit-msg stage)
#
# If upstream bumps their pre-commit rules, we pick those up on the next
# upstream merge into svasamm/base.

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
            files: "crm.*"
            exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
          - id: no-commit-to-branch
            # Svasamm addition: also block main (upstream only blocked develop).
            args: ["--branch", "develop", "--branch", "main"]
          - id: check-merge-conflict
          - id: check-ast
          - id: check-json
          - id: check-toml
          - id: check-yaml
          - id: debug-statements

    - repo: https://github.com/oxc-project/mirrors-oxlint
      rev: v1.50.0
      hooks:
          - id: oxlint
            files: ^frontend/.*\.(js|ts|vue)$

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.1.0
      hooks:
          - id: prettier
            files: ^frontend/.*\.(js|ts|vue|css|scss|html|json)$
            additional_dependencies:
                - prettier@3.2.5
            exclude: |
                (?x)^(
                    crm/public/dist/.*|
                    crm/public/frontend/.*|
                    .*node_modules.*|
                )$

    - repo: local
      hooks:
          - id: eslint
            name: eslint
            entry: bash -c 'cd frontend && eslint --fix src/**/*.{js,ts,vue}'
            language: node
            files: ^frontend/.*\.(js|ts|vue)$
            pass_filenames: false
            additional_dependencies:
                - "eslint@^10.0.2"
                - "@eslint/js@^10.0.1"
                - "typescript-eslint@^8.56.1"
                - "eslint-plugin-vue@^10.8.0"
                - "eslint-config-prettier@^10.1.8"
                - "globals@^17.3.0"
                - "vue-eslint-parser@^10.4.0"

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.8.1
      hooks:
          - id: ruff
            name: "Run ruff linter and apply fixes"
            args: ["--fix"]
          - id: ruff-format
            name: "Run ruff formatter"

    # Commitlint runs via CI (linters.yml::semantic-commits), not as a
    # local pre-commit hook. The pre-commit hook tries to install its own
    # Node binary which has a libc++ ABI mismatch on macOS Sequoia (dyld
    # 'Symbol not found' on __libcpp_verbose_abort). CI runs Conventional
    # Commits validation on every PR regardless.

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
