# Pre-push test hook deliberately omitted — Playwright runs in CI only.
# Add a local script in a future task if local pre-push coverage is desired.
exclude: 'node_modules|.git|frontend/dist'
default_stages: [pre-commit]
# Register hook types so `pre-commit install` sets up:
#   .git/hooks/pre-commit   ← runs before every commit  (linting)
#   .git/hooks/commit-msg   ← validates the commit message (commitlint)
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "frontend/.*|.*/crm/.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg|frontend/dist/.*|node_modules/.*"
      # Block direct commits to main and develop — use a PR instead.
      # uat is allowed (cherry-picks from develop); deploys are gated by GitHub Releases.
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'develop']
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        language_version: system
        types_or: [vue, javascript, ts, json, scss]
        # Ignore generated and vendored files
        exclude: |
            (?x)^(
                frontend/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                crm/public/dist/.*|
                crm/public/frontend/.*|
                crm/templates/includes/.*
            )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        language_version: system
        types_or: [javascript, vue, ts]
        args: ['--quiet']
        # Ignore generated and vendored files
        exclude: |
            (?x)^(
                frontend/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                crm/public/dist/.*|
                crm/public/frontend/.*|
                crm/templates/includes/.*
            )$

  # Validates commit messages against commitlint.config.cjs on every `git commit`
  # language_version: system → uses your PATH node instead of a pre-commit-managed
  # binary (avoids macOS libc++ incompatibility on Monterey / Darwin 21).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        language_version: system
        additional_dependencies: ['conventional-changelog-conventionalcommits']

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
